# PC runtime configuration for SDL2 build
# 1/true/yes/on = enabled
# 0/false/no/off = disabled
# audio_sample_rate is the requested output device rate
# internal synthesis stays at native 42048 Hz, and is resampled to output as needed
# audio_sample_rate valid range: 8000..192000
# audio_buffer_samples valid range: 128..8192
# audio_volume valid range: 0.0..4.0 (1.0 = normal)

enable_shader = true
window_scale = 5
shader_path = shaders/upscale.frag

enable_audio = true
audio_sample_rate = 48000
audio_buffer_samples = 1024
audio_volume = 1.0
